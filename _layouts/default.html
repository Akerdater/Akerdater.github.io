<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body>

    <!-- WICHTIG: Die Checkbox steuert das Ein- und Ausblenden der Sidebar -->
    <input type="checkbox" class="sidebar-checkbox" id="sidebar-checkbox">

    <!-- Die eigentliche Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-item" style="padding-bottom: 0; text-align: center;">
        
        <!-- DEIN NEUES LOGO BILD AUS DEM ASSETS ORDNER -->
        <a href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/Bild2232.png' | relative_url }}" alt="Kunz Logo" style="max-width: 200px; height: auto; border-radius: .25rem; display: block; margin: 0 auto 1rem auto;">
        </a>
        
        <p style="margin-top: 0.5rem; font-size: 85%;">{{ site.description }}</p>
      </div>

      {% include sidebar.html %}


      <div class="sidebar-item">
        <p>&copy; {{ site.time | date: '%Y' }}. All rights reserved.</p>
      </div>
    </div>

     <!-- Wrap ist der Hauptinhalt der Website -->
    <div class="wrap">
       <!-- INTELLIGENTER OBERER BALKEN (Höherer Kasten für eine stabile, tiefere Linie) -->
      <div class="masthead" style="padding: 0 !important; margin-bottom: 0;">
        <div class="container" style="display: flex; justify-content: center; align-items: center; position: relative; height: 120px; padding-top: 0 !important; padding-bottom: 0 !important;">

          <h3 class="masthead-title" style="margin-top: 0; margin-bottom: 0; text-align: center; width: 100%; display: flex; justify-content: center; align-items: center; height: 100%;">
            
            <a href="{{ site.baseurl }}/" title="Home" style="display: inline-flex; flex-direction: column; align-items: center; justify-content: center; height: 100px; width: 100%; text-decoration: none;">
              
              <!-- 1. DER TEXT: Wird in den 100px Höhe automatisch perfekt vertikal eingemittet -->
              <span class="masthead-text-only" style="font-weight: normal; color: #222; line-height: 1.2;">{{ site.title }}</span>
              <small class="masthead-text-only" style="font-size: 60%; color: #999; margin-top: 6px; font-weight: normal; font-family: sans-serif;">recorder player & &ldquo;maker&rdquo;</small>
              
              <!-- 2. DAS LOGO: Hat jetzt volle 100px Platz und bleibt wunderschön quadratisch -->
              <img class="masthead-logo-only" src="{{ '/assets/Bild2232.png' | relative_url }}" alt="Logo" style="height: 100px; width: 100px; object-fit: contain; display: block; margin: 0 auto;">
              
            </a>

          </h3>
        </div>
      </div>

      <!-- Abstand (Luft) unterhalb der tieferen, stabilen Trennlinie -->
      <div class="container content" style="margin-top: 30px !important;">





      <!-- ZUGEHÖRIGES CSS FÜR DEN WECHSEL -->
      <style>
        /* Standardzustand (Sidebar ist ZU oder auf dem Handy): Zeige das Logo, verstecke den Text */
        .masthead-text-only { display: none !important; }
        .masthead-logo-only { display: block !important; }

        /* Wenn die Sidebar OFFEN ist (Klasse 'sidebar-desktop-open' aktiv): Zeige Text, verstecke das Logo */
        .sidebar-desktop-open .masthead-text-only { display: block !important; }
        .sidebar-desktop-open .masthead-logo-only { display: none !important; }
        
        /* Erzwingt, dass der Untertitel sauber unter dem Namen steht */
        .sidebar-desktop-open small.masthead-text-only { display: block !important; }
      </style>

          </h3>
        </div>
      </div>


      <div class="container content">
        {{ content }}
      </div>
    </div>

    <!-- Das Hamburger-Icon zum Klicken -->
    <label for="sidebar-checkbox" class="sidebar-toggle" id="desktop-toggle-btn"></label>

    <script src='{{ site.baseurl }}/public/js/script.js'></script>
    
    <!-- JavaScript für die korrekte Sidebar-Steuerung -->
    <script>
      document.addEventListener("DOMContentLoaded", function() {
        var checkbox = document.getElementById("sidebar-checkbox");
        var toggleBtn = document.getElementById("desktop-toggle-btn");
        var body = document.body;

        // 1. DESKTOP-INITIALISIERUNG: Beim Laden standardmäßig die "Offen"-Klasse hinzufügen
        if (window.innerWidth >= 768) {
          body.classList.add("sidebar-desktop-open");
          checkbox.checked = false; // Verhindert Konflikte mit dem Handy-CSS
        }

        // 2. DESKTOP & HANDY KLICK-LOGIK FÜR DIE MENÜSTRICHE
        toggleBtn.addEventListener("click", function(e) {
          if (window.innerWidth >= 768) {
            e.preventDefault();
            body.classList.toggle("sidebar-desktop-open");
          }
        });

        // 3. EXPAND/COLLAPSE FÜR UNTERORDNER (Desktop & Mobil)
        var toggles = document.querySelectorAll(".dropdown-toggle");
        toggles.forEach(function(toggle) {
          toggle.addEventListener("click", function(e) {
            e.preventDefault();
            
            // WICHTIG FÜR HANDY: Stoppt das originale Lanyon-Skript (script.js), 
            // damit die Sidebar bei diesem Klick NICHT automatisch geschlossen wird!
            e.stopPropagation(); 

            var targetId = this.getAttribute("data-target");
            var targetContainer = document.getElementById(targetId);
            if (targetContainer) {
              targetContainer.classList.toggle("is-open");
            }
          });
        });

        // 4. HANDY-LOGIK FÜR ECHTE LINKS: Sidebar sanft einfahren lassen vor dem Seitenwechsel
        var sidebarLinks = document.querySelectorAll(".sidebar a");
        sidebarLinks.forEach(function(link) {
          link.addEventListener("click", function(e) {
            if (window.innerWidth < 768) {
              if (this.classList.contains("dropdown-toggle")) {
                return;
              }
              
              var href = this.getAttribute("href");
              if (!href || href === "#" || href === "") {
                return;
              }

              // Holt die exakte, vollständige Ziel-URL der Jekyll-Unterseite
              var targetUrl = this.href;

              // Verhindert das sofortige unschöne Springen der Seite
              e.preventDefault();
              
              // Schließt die Sidebar zuerst (dadurch greift die CSS-Gleit-Animation)
              checkbox.checked = false;
              
              // Wartet 250 Millisekunden, damit die Sidebar elegant einfahren kann,
              // und leitet erst DANN auf die neue Seite weiter
              setTimeout(function() {
                window.location.href = targetUrl;
              }, 250);
            }
          });
        });

        // Aktiven Unterordner geöffnet lassen beim Seitenwechsel
        var activeSubItem = document.querySelector(".sidebar-nav-item.sub-item.active");
        if (activeSubItem) {
          var parentContainer = activeSubItem.closest(".sidebar-dropdown-container");
          if (parentContainer) {
            parentContainer.classList.add("is-open");
          }
        }
      });
    </script>
  </body>
</html>
